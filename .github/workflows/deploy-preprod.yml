name: Deploy Preprod

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref (branch, tag, or commit SHA) to deploy to preprod
        required: true
        type: string

jobs:
  deploy:
    name: Build And Deploy Preprod Worker
    runs-on: ubuntu-latest
    environment: preprod
    concurrency:
      group: deploy-preprod
      cancel-in-progress: false
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Setup npm
        env:
          npm_config_min_release_age: "0"
        run: npm install --global npm@11.14.0

      - name: Validate Dependency Policy
        run: npm run validate:deps

      - name: Configure npm Install Policy
        run: node ./scripts/configure-npm-install-policy.mjs >> "$GITHUB_ENV"

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit And Integration Tests
        run: npm test

      - name: Validate Production Env Invariants
        env:
          NODE_ENV: production
          NEXT_PUBLIC_RUNTIME_MODE: production
          NEXT_PUBLIC_USE_MOCKS: "false"
          NEXT_PUBLIC_E2E: "false"
          NEXT_PUBLIC_ENABLE_DEBUG_UI: "false"
          NEXT_PUBLIC_ENABLE_SIMULATION_TRANSPORT_FALLBACK: "false"
          NEXT_PUBLIC_DAO_DEPLOYMENTS: ${{ vars.NEXT_PUBLIC_DAO_DEPLOYMENTS }}
          NEXT_PUBLIC_ENABLE_DAO: ${{ vars.NEXT_PUBLIC_ENABLE_DAO || secrets.NEXT_PUBLIC_ENABLE_DAO || 'false' }}
          NEXT_PUBLIC_ENABLE_DAO_REVIEW_CONTROLS: ${{ vars.NEXT_PUBLIC_ENABLE_DAO_REVIEW_CONTROLS || secrets.NEXT_PUBLIC_ENABLE_DAO_REVIEW_CONTROLS || 'false' }}
          NEXT_PUBLIC_ENABLE_TEAMS: ${{ vars.NEXT_PUBLIC_ENABLE_TEAMS || secrets.NEXT_PUBLIC_ENABLE_TEAMS || 'false' }}
          NEXT_PUBLIC_ENABLE_YBC: ${{ vars.NEXT_PUBLIC_ENABLE_YBC || secrets.NEXT_PUBLIC_ENABLE_YBC || 'false' }}
          NEXT_PUBLIC_ENABLE_YETH: ${{ vars.NEXT_PUBLIC_ENABLE_YETH || secrets.NEXT_PUBLIC_ENABLE_YETH || 'false' }}
          NEXT_PUBLIC_WC_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_WC_PROJECT_ID || vars.NEXT_PUBLIC_WC_PROJECT_ID }}
          NEXT_PUBLIC_GLOBAL_DATA_URL: ${{ vars.NEXT_PUBLIC_GLOBAL_DATA_URL || secrets.NEXT_PUBLIC_GLOBAL_DATA_URL }}
          NEXT_PUBLIC_TEAMS_DATA_URL: ${{ vars.NEXT_PUBLIC_TEAMS_DATA_URL || secrets.NEXT_PUBLIC_TEAMS_DATA_URL }}
          NEXT_PUBLIC_YBC_DATA_URL: ${{ vars.NEXT_PUBLIC_YBC_DATA_URL || secrets.NEXT_PUBLIC_YBC_DATA_URL }}
          NEXT_PUBLIC_YETH_GLOBAL_DATA_URL: ${{ secrets.NEXT_PUBLIC_YETH_GLOBAL_DATA_URL || vars.NEXT_PUBLIC_YETH_GLOBAL_DATA_URL }}
          NEXT_PUBLIC_RPC_URLS: ${{ secrets.NEXT_PUBLIC_RPC_URLS || vars.NEXT_PUBLIC_RPC_URLS }}
        run: npm run validate:prod-env

      - name: Build OpenNext Worker
        env:
          NODE_ENV: production
          NEXT_PUBLIC_RUNTIME_MODE: production
          NEXT_PUBLIC_USE_MOCKS: "false"
          NEXT_PUBLIC_E2E: "false"
          NEXT_PUBLIC_ENABLE_DEBUG_UI: "false"
          NEXT_PUBLIC_ENABLE_SIMULATION_TRANSPORT_FALLBACK: "false"
          NEXT_PUBLIC_DAO_DEPLOYMENTS: ${{ vars.NEXT_PUBLIC_DAO_DEPLOYMENTS }}
          NEXT_PUBLIC_ENABLE_DAO: ${{ vars.NEXT_PUBLIC_ENABLE_DAO || secrets.NEXT_PUBLIC_ENABLE_DAO || 'false' }}
          NEXT_PUBLIC_ENABLE_DAO_REVIEW_CONTROLS: ${{ vars.NEXT_PUBLIC_ENABLE_DAO_REVIEW_CONTROLS || secrets.NEXT_PUBLIC_ENABLE_DAO_REVIEW_CONTROLS || 'false' }}
          NEXT_PUBLIC_ENABLE_TEAMS: ${{ vars.NEXT_PUBLIC_ENABLE_TEAMS || secrets.NEXT_PUBLIC_ENABLE_TEAMS || 'false' }}
          NEXT_PUBLIC_ENABLE_YBC: ${{ vars.NEXT_PUBLIC_ENABLE_YBC || secrets.NEXT_PUBLIC_ENABLE_YBC || 'false' }}
          NEXT_PUBLIC_ENABLE_YETH: ${{ vars.NEXT_PUBLIC_ENABLE_YETH || secrets.NEXT_PUBLIC_ENABLE_YETH || 'false' }}
          NEXT_PUBLIC_WC_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_WC_PROJECT_ID || vars.NEXT_PUBLIC_WC_PROJECT_ID }}
          NEXT_PUBLIC_GLOBAL_DATA_URL: ${{ vars.NEXT_PUBLIC_GLOBAL_DATA_URL || secrets.NEXT_PUBLIC_GLOBAL_DATA_URL }}
          NEXT_PUBLIC_TEAMS_DATA_URL: ${{ vars.NEXT_PUBLIC_TEAMS_DATA_URL || secrets.NEXT_PUBLIC_TEAMS_DATA_URL }}
          NEXT_PUBLIC_YBC_DATA_URL: ${{ vars.NEXT_PUBLIC_YBC_DATA_URL || secrets.NEXT_PUBLIC_YBC_DATA_URL }}
          NEXT_PUBLIC_YETH_GLOBAL_DATA_URL: ${{ secrets.NEXT_PUBLIC_YETH_GLOBAL_DATA_URL || vars.NEXT_PUBLIC_YETH_GLOBAL_DATA_URL }}
          NEXT_PUBLIC_RPC_URLS: ${{ secrets.NEXT_PUBLIC_RPC_URLS || vars.NEXT_PUBLIC_RPC_URLS }}
        run: npm run worker:build

      - name: Validate Worker Size
        run: npm run validate:worker-size -- wrangler.preprod.jsonc

      - name: Deploy To Cloudflare Preprod
        env:
          NODE_ENV: production
          NEXT_PUBLIC_RUNTIME_MODE: production
          NEXT_PUBLIC_USE_MOCKS: "false"
          NEXT_PUBLIC_E2E: "false"
          NEXT_PUBLIC_ENABLE_DEBUG_UI: "false"
          NEXT_PUBLIC_ENABLE_SIMULATION_TRANSPORT_FALLBACK: "false"
          NEXT_PUBLIC_DAO_DEPLOYMENTS: ${{ vars.NEXT_PUBLIC_DAO_DEPLOYMENTS }}
          NEXT_PUBLIC_ENABLE_DAO: ${{ vars.NEXT_PUBLIC_ENABLE_DAO || secrets.NEXT_PUBLIC_ENABLE_DAO || 'false' }}
          NEXT_PUBLIC_ENABLE_DAO_REVIEW_CONTROLS: ${{ vars.NEXT_PUBLIC_ENABLE_DAO_REVIEW_CONTROLS || secrets.NEXT_PUBLIC_ENABLE_DAO_REVIEW_CONTROLS || 'false' }}
          NEXT_PUBLIC_ENABLE_TEAMS: ${{ vars.NEXT_PUBLIC_ENABLE_TEAMS || secrets.NEXT_PUBLIC_ENABLE_TEAMS || 'false' }}
          NEXT_PUBLIC_ENABLE_YBC: ${{ vars.NEXT_PUBLIC_ENABLE_YBC || secrets.NEXT_PUBLIC_ENABLE_YBC || 'false' }}
          NEXT_PUBLIC_ENABLE_YETH: ${{ vars.NEXT_PUBLIC_ENABLE_YETH || secrets.NEXT_PUBLIC_ENABLE_YETH || 'false' }}
          NEXT_PUBLIC_WC_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_WC_PROJECT_ID || vars.NEXT_PUBLIC_WC_PROJECT_ID }}
          NEXT_PUBLIC_GLOBAL_DATA_URL: ${{ vars.NEXT_PUBLIC_GLOBAL_DATA_URL || secrets.NEXT_PUBLIC_GLOBAL_DATA_URL }}
          NEXT_PUBLIC_TEAMS_DATA_URL: ${{ vars.NEXT_PUBLIC_TEAMS_DATA_URL || secrets.NEXT_PUBLIC_TEAMS_DATA_URL }}
          NEXT_PUBLIC_YBC_DATA_URL: ${{ vars.NEXT_PUBLIC_YBC_DATA_URL || secrets.NEXT_PUBLIC_YBC_DATA_URL }}
          NEXT_PUBLIC_YETH_GLOBAL_DATA_URL: ${{ secrets.NEXT_PUBLIC_YETH_GLOBAL_DATA_URL || vars.NEXT_PUBLIC_YETH_GLOBAL_DATA_URL }}
          NEXT_PUBLIC_RPC_URLS: ${{ secrets.NEXT_PUBLIC_RPC_URLS || vars.NEXT_PUBLIC_RPC_URLS }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run worker:deploy:preprod
